[build]
builder = "NIXPACKS"

[deploy]
restartPolicyType = "ALWAYS"

# No startCommand here on purpose: this repo is deployed as THREE separate
# Railway services (one per asset), sharing this one railway.toml/repo --
# each service sets its own Start Command in the Railway dashboard
# (python -m poly_analyzer.main --asset btc / --asset eth / --asset sol).
# Config-as-code values override dashboard values, so hardcoding one asset
# here would force all three services onto the same command. All three
# need the same POLY_ANALYZER_DSN env var (shared Postgres) set per-service.

# binance.com's WebSocket edge returns HTTP 451 (geo-blocked) for
# connections from US IPs -- Railway's default region is US, which breaks
# the Binance feed entirely (Polymarket/Chainlink still connect fine, only
# Binance is blocked). europe-west4-drams3a (Amsterdam) is not
# Binance-restricted. Single region, one replica per service -- these are
# stateful background workers, not horizontally-scaled APIs.
[deploy.multiRegionConfig."europe-west4-drams3a"]
numReplicas = 1
