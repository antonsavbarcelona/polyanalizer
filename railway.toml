[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m poly_analyzer.main"
restartPolicyType = "ALWAYS"

# Deployed as THREE separate Railway services (one per asset), all sharing
# this one railway.toml/repo/Start Command -- each service is
# differentiated purely by its own env vars, not a per-service command
# override: set POLY_ANALYZER_ASSET=btc / eth / sol per service, plus the
# same POLY_ANALYZER_DSN (shared Postgres) on all three.

# binance.com's WebSocket edge returns HTTP 451 (geo-blocked) for
# connections from US IPs -- Railway's default region is US, which breaks
# the Binance feed entirely (Polymarket/Chainlink still connect fine, only
# Binance is blocked). europe-west4-drams3a (Amsterdam) is not
# Binance-restricted. Single region, one replica per service -- these are
# stateful background workers, not horizontally-scaled APIs.
[deploy.multiRegionConfig."europe-west4-drams3a"]
numReplicas = 1
